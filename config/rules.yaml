# UCL Fantasy 2026/27 rules.
# Scoring derived empirically from official popupstats point breakdowns (2026-11-08, 60 players x 4 MDs).
# Values marked "assumed" were not observed in the sample yet.
season_tour_id: 90
budget: 100.0
squad: {GK: 2, DEF: 5, MID: 5, FWD: 3}
starting_xi: {GK: [1, 1], DEF: [3, 5], MID: [2, 5], FWD: [1, 3]}   # min/max per position
max_per_club: 3            # league phase; read live value from constraints feed
free_transfers_per_md: 2   # substitutionsAllowed in team API
extra_transfer_cost: 4
unlimited_transfer_mds: [1, 9, 11, 13]   # before MD1, before play-offs, R16, QF (check web.json each stage)
chips: [wildcard, limitless]
captain_multiplier: 2

positions: {1: GK, 2: DEF, 3: MID, 4: FWD}

scoring:
  appearance: {under_60: 1, min_60: 2}
  goal: {GK: 6, DEF: 6, MID: 5, FWD: 4}          # GK assumed = DEF
  assist: 3
  goal_outside_box: 1                             # bonus, per goal
  clean_sheet: {GK: 4, DEF: 4, MID: 1, FWD: 0}    # only if 60+ mins
  goals_conceded_per_2: {GK: -1, DEF: -1}         # -1 per 2 conceded
  saves_per_3: 1                                  # GK: +1 per 3 saves (observed 3->1, 6->2)
  penalty_save: 5
  penalty_earned: 2
  penalty_missed: -2
  ball_recoveries_per_3: 1                        # all outfield positions
  player_of_match: 3
  yellow: -1
  red: -3                                         # assumed
  own_goal: -2
